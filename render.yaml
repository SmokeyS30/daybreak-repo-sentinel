services:
  - type: web
    name: daybreak-repo-sentinel
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://daybreak-repo-sentinel.onrender.com
      - key: DATA_DIR
        value: /var/data/sentinel
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: SCAN_INTERVAL_MINUTES
        value: "15"
      - key: MAX_REPOSITORIES_PER_SCAN
        value: "250"
      - key: PUBLIC_METRICS
        value: "true"
      - key: AUTO_PUBLISH_ISSUES
        value: "false"
    disk:
      name: sentinel-data
      mountPath: /var/data
      sizeGB: 1
